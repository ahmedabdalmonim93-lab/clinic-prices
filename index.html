<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قائمة أسعار الخدمات - د. محمد أبو مسلم</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap');

        :root {
            --primary-navy: #0d2746; 
            --accent-teal: #237b8f; 
            --bg-light: #f4f7f9; 
            --text-main: #2c3e50;
            --text-muted: #7f8c8d;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-light);
            color: var(--text-main);
            margin: 0;
            padding: 50px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .main-logo {
            max-width: 240px;
            height: auto;
            margin-bottom: 40px;
            display: block;
            position: relative;
            z-index: 2;
        }

        .page-wrapper {
            width: 100%;
            max-width: 800px;
            position: relative;
        }

        .page-wrapper::before {
            content: "";
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80%; 
            height: 80%;
            background-image: url('1000199834.jpg');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            opacity: 0.03; 
            z-index: 0;
            pointer-events: none;
        }

        .header-title {
            text-align: center;
            margin-bottom: 30px;
            position: relative;
            z-index: 1;
        }

        .header-title h2 {
            margin: 0;
            color: var(--primary-navy); 
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        /* لودر تحميل يظهر حتى تكتمل قراءة البيانات */
        .loading-text {
            text-align: center;
            font-weight: 600;
            color: var(--text-muted);
            padding: 40px;
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0 15px; 
            text-align: right;
            position: relative;
            z-index: 1;
            display: none; /* يختفي حتى يتم التحميل */
        }

        thead th {
            color: var(--text-muted);
            font-size: 1.1rem;
            font-weight: 600;
            padding: 0 24px 10px 24px;
            border-bottom: 2px solid #e1e8ed;
        }

        tbody tr {
            background-color: #ffffff;
            box-shadow: 0 4px 15px rgba(13, 39, 70, 0.04); 
            border-radius: 12px; 
            transition: all 0.3s ease;
        }

        tbody tr.service-row {
            cursor: pointer;
        }

        tbody tr.service-row:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(35, 123, 143, 0.12);
        }

        th, td {
            padding: 22px 24px;
            border: none; 
        }

        td:first-child { 
            border-radius: 0 12px 12px 0; 
            border-right: 5px solid var(--accent-teal); 
        }
        td:last-child { 
            border-radius: 12px 0 0 12px; 
        }

        .service-name {
            font-weight: 700;
            color: var(--primary-navy);
            font-size: 1.2rem;
        }

        .price-container {
            direction: ltr;
            display: inline-block;
            text-align: left;
            background-color: rgba(35, 123, 143, 0.06); 
            padding: 8px 16px;
            border-radius: 8px;
        }

        .price {
            font-weight: 800;
            color: var(--accent-teal); 
            font-size: 1.2rem;
        }

        /* --- النافذة المنبثقة (Gallery Modal) --- */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(13, 39, 70, 0.85); 
            z-index: 1000;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.3s ease;
            backdrop-filter: blur(4px); 
        }

        .modal-content {
            background-color: #ffffff;
            border-radius: 16px;
            padding: 35px 30px;
            width: 90%;
            max-width: 650px;
            text-align: center;
            position: relative;
            box-shadow: 0 20px 50px rgba(0,0,0,0.4);
            transform: scale(0.95);
            transition: transform 0.3s ease;
        }

        .modal-overlay.active {
            display: flex;
            opacity: 1;
        }

        .modal-overlay.active .modal-content {
            transform: scale(1);
        }

        .close-btn {
            position: absolute;
            top: 20px;
            right: 25px;
            font-size: 2rem;
            color: var(--primary-navy); 
            cursor: pointer;
            font-weight: 600;
            line-height: 1;
            transition: color 0.2s;
        }

        .close-btn:hover {
            color: var(--accent-teal);
        }

        .modal-title {
            color: var(--primary-navy);
            margin-top: 0;
            margin-bottom: 25px;
            font-size: 1.6rem;
            font-weight: 800;
        }

        .slider-container {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: var(--bg-light); 
            border-radius: 12px;
            padding: 15px;
            min-height: 280px;
        }

        .slider-img {
            max-width: 100%;
            max-height: 55vh;
            border-radius: 8px;
            display: block;
            object-fit: contain;
        }

        .slider-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background-color: var(--primary-navy);
            color: white;
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            font-size: 1.2rem;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 6px 15px rgba(13, 39, 70, 0.25);
            transition: all 0.2s ease;
        }

        .slider-btn:hover {
            background-color: var(--accent-teal);
            transform: translateY(-50%) scale(1.05);
        }

        .slider-btn.prev { right: -22px; } 
        .slider-btn.next { left: -22px; } 

        .image-counter {
            margin-top: 20px;
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

<img src="1000199834.jpg" alt="Mohamed Abo Mosalam Dental Clinic" class="main-logo">

<div class="page-wrapper">
    <div class="header-title">
        <h2>الخدمات والأسعار</h2>
    </div>
    
    <div id="loading" class="loading-text">جاري تحميل قائمة الأسعار المحدثة...</div>

    <table id="pricesTable">
        <thead>
            <tr>
                <th>اسم الخدمة</th>
                <th>التكلفة التقريبية (ج.م)</th>
            </tr>
        </thead>
        <tbody id="tableBody">
            </tbody>
    </table>
</div>

<div class="modal-overlay" id="galleryModal">
    <div class="modal-content">
        <span class="close-btn" id="closeModal">&times;</span>
        <h3 class="modal-title" id="modalTitle">اسم الخدمة</h3>
        
        <div class="slider-container">
            <button class="slider-btn prev" id="prevBtn">&#10095;</button>
            <img id="mainImage" class="slider-img" src="" alt="صورة الخدمة">
            <button class="slider-btn next" id="nextBtn">&#10094;</button>
        </div>
        
        <div class="image-counter" id="imageCounter">1 / 1</div>
    </div>
</div>

<script>
    // ⚠️ استبدل النص بالأسفل بـ ID شيت جوجل الخاص بك
    const SHEET_ID = '1eKSjyLHUIe6sKARxh1OMuxXGk34cU8iyafQmMqgTAS4'; 
    const SHEET_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json`;

    const modal = document.getElementById('galleryModal');
    const closeModalBtn = document.getElementById('closeModal');
    const mainImage = document.getElementById('mainImage');
    const modalTitle = document.getElementById('modalTitle');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const imageCounter = document.getElementById('imageCounter');

    let currentImagesArray = [];
    let currentImageIndex = 0;

    // جلب البيانات من شيت جوجل وبناء الواجهة
    fetch(SHEET_URL)
        .then(res => res.text())
        .then(data => {
            const jsonText = data.match(/google\.visualization\.Query\.setResponse\(([\s\S]*?)\);/)[1];
            const jsonObj = JSON.parse(jsonText);
            const rows = jsonObj.table.rows;
            
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = ''; 

            rows.forEach(row => {
                const name = (row.c[0] && row.c[0].v) ? row.c[0].v : '';
                const price = (row.c[1] && row.c[1].v) ? row.c[1].v : '';
                const images = (row.c[2] && row.c[2].v) ? row.c[2].v : '';

                if (!name) return; // تخطي الأسطر الفارغة

                const tr = document.createElement('tr');
                
                if (images) {
                    tr.className = 'service-row';
                    tr.setAttribute('data-images', images);
                    tr.setAttribute('data-title', name);
                    
                    // تشغيل المعرض عند الضغط
                    tr.addEventListener('click', function() {
                        currentImagesArray = images.split(',');
                        currentImageIndex = 0;
                        modalTitle.textContent = name;
                        updateGallery();
                        modal.classList.add('active');
                    });
                } else {
                    tr.className = 'no-images';
                }

                tr.innerHTML = `
                    <td class="service-name">${name}</td>
                    <td><div class="price-container"><span class="price">${price}</span></div></td>
                `;
                tbody.appendChild(tr);
            });

            // إخفاء رسالة التحميل وإظهار الجدول الفخم
            document.getElementById('loading').style.display = 'none';
            document.getElementById('pricesTable').style.display = 'table';
        })
        .catch(err => {
            document.getElementById('loading').textContent = 'عذراً، حدث خطأ أثناء تحميل البيانات المتزامنة.';
            console.error(err);
        });

    function updateGallery() {
        mainImage.src = currentImagesArray[currentImageIndex].trim();
        imageCounter.textContent = `${currentImageIndex + 1} / ${currentImagesArray.length}`;
        
        if (currentImagesArray.length <= 1) {
            prevBtn.style.display = 'none';
            nextBtn.style.display = 'none';
        } else {
            prevBtn.style.display = 'flex';
            nextBtn.style.display = 'flex';
        }
    }

    nextBtn.addEventListener('click', () => {
        currentImageIndex = (currentImageIndex + 1) % currentImagesArray.length;
        updateGallery();
    });

    prevBtn.addEventListener('click', () => {
        currentImageIndex = (currentImageIndex - 1 + currentImagesArray.length) % currentImagesArray.length;
        updateGallery();
    });

    closeModalBtn.addEventListener('click', () => {
        modal.classList.remove('active');
    });

    window.addEventListener('click', (e) => {
        if (e.target === modal) {
            modal.classList.remove('active');
        }
    });
</script>

</body>
</html>
